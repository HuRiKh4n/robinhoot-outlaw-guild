name: Hold & Win draw

on:
  schedule:
    - cron: "30 20 * * 0"   # every Sunday 20:30 UTC (seed = first NEAR block after 20:00). Weekly or Grand Prize by the 4-Sunday cycle.
  workflow_dispatch:
    inputs:
      kind:
        description: "auto (follow the cycle), weekly, or monthly (= Grand Prize)"
        required: true
        default: auto
      date:
        description: "Sunday YYYY-MM-DD (empty = most recent)"
        required: false

permissions:
  contents: write

concurrency: draw

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wallet libraries (only when the Guild Chest contract pays)
        if: hashFiles('public/chest.json') != ''
        run: npm install --no-save --no-audit --no-fund near-api-js@4.0.4 tweetnacl@1 bs58@4
      - name: Draw
        env:
          DRAWER_SEED: ${{ secrets.DRAWER_SEED }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/draw.mjs "${{ inputs.kind }}" ${{ inputs.date }}
          else
            node scripts/draw.mjs auto
          fi
      - name: Publish result
        run: |
          git config user.name "RobinHoot draw"
          git config user.email "evilhuri@gmail.com"
          git add public/draws
          git commit -m "Hold & Win draw result" || echo "nothing new"
          git push
