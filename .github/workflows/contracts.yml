name: Contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts }
      - name: Unit tests
        run: cargo test --workspace -- --nocapture
      - name: Build (wasm)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          (cd guild-chest && cargo near build non-reproducible-wasm --no-abi)
          ls -la target/near/guild_chest/
      - uses: actions/upload-artifact@v4
        with: { name: guild-chest-wasm, path: contracts/target/near/guild_chest/guild_chest.wasm }
